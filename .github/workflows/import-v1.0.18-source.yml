name: Import v1.0.18 source

on:
  workflow_dispatch:
  push:
    branches:
      - open-source-release
    paths:
      - .github/workflows/import-v1.0.18-source.yml

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: open-source-release
          fetch-depth: 0

      - name: Download and verify v1.0.18 release package
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/LastThylacine/dino-server-releases/releases/download/v1.0.18/DinoServer-Windows-v1.0.18.zip"
          EXPECTED="aabb738b47d6d37454f9e03ead74ab09c5c41540f576d04bd8371adffc7311cc"
          curl --fail --location --retry 3 "$URL" --output /tmp/DinoServer-Windows-v1.0.18.zip
          ACTUAL="$(sha256sum /tmp/DinoServer-Windows-v1.0.18.zip | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          echo "Verified SHA-256: $ACTUAL"

      - name: Extract source and required runtime files
        shell: python
        run: |
          from pathlib import Path, PurePosixPath
          import shutil
          import zipfile

          archive = Path('/tmp/DinoServer-Windows-v1.0.18.zip')
          repo = Path.cwd()

          # Files intentionally not published in the source tree.
          excluded_exact = {
              'DinoServer.exe',
              'CHECKSUMS.txt',
              'README_FIRST.txt',
              'LOCAL_SERVER_README.txt',
              'THIRD_PARTY_NOTICES.md',
              'config/device_links.json',
              'config/whitelist.json',
              'assets/guide/hosts_manager_lite_main.png',
              'assets/guide/hosts_manager_lite_add_item.png',
          }

          # Runtime configuration required by Dino Server is intentionally tracked.
          required_runtime = {
              'config/cache_index_android.json',
              'config/cache_index_ios.json',
              'config/fixed_manifest.json',
              'config/fixed_manifest_android.json',
              'config/fixed_manifest_ios.json',
              'config/onlineoptions',
              'config/offer_rotation.json',
          }

          allowed_suffixes = {
              '.py', '.ps1', '.bat', '.svg', '.png', '.ico', '.txt', '.md', '.json'
          }

          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  if info.is_dir():
                      continue

                  # The release was produced on Windows and stores backslashes.
                  name = info.filename.replace('\\', '/')
                  if name.startswith('DinoServer/'):
                      name = name[len('DinoServer/'):]
                  name = str(PurePosixPath(name))

                  if not name or name in excluded_exact:
                      continue
                  if name.startswith('cache_android/') or name.startswith('cache_ios/'):
                      # Keep only the empty-directory guidance files.
                      if not name.endswith('PLACE_CACHE_FILES_HERE.txt'):
                          continue
                  if name.startswith('assets/guide/'):
                      continue

                  suffix = PurePosixPath(name).suffix.lower()
                  if name not in required_runtime and suffix not in allowed_suffixes:
                      continue

                  target = repo / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(zf.read(info))

          # The release package's notices describe files that are not part of
          # this source repository. A repository-specific notice is maintained
          # separately and must not be overwritten here.

      - name: Install GPL-3.0 license text
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://www.gnu.org/licenses/gpl-3.0.txt \
            --output LICENSE

      - name: Check repository policy
        shell: bash
        run: |
          set -euo pipefail
          test ! -e DinoServer.exe
          test ! -e config/device_links.json
          test ! -e config/whitelist.json
          test -e config/cache_index_android.json
          test -e config/cache_index_ios.json
          test -e config/fixed_manifest.json
          test -e config/fixed_manifest_android.json
          test -e config/fixed_manifest_ios.json
          test -e config/onlineoptions
          test -e launcher/app.py
          test -e jpb_server/current_server.py

          if find cache_android cache_ios -type f ! -name PLACE_CACHE_FILES_HERE.txt -print -quit | grep -q .; then
            echo "Unexpected cache file found in source tree" >&2
            exit 1
          fi

          if grep -RniE 'reverse[ -]?engineer(ing|ed)?' \
              README.md CONTRIBUTING.md SECURITY.md config launcher jpb_server tools \
              --exclude-dir=.git 2>/dev/null; then
            echo "Disallowed wording found" >&2
            exit 1
          fi

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "source: publish Dino Server v1.0.18"
          git push origin HEAD:open-source-release
